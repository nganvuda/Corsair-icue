<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meg's House ✦</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #F8FAFC;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background:
                radial-gradient(circle at top left, rgba(167, 139, 250, 0.15), transparent 35%),
                radial-gradient(circle at top right, rgba(125, 211, 252, 0.12), transparent 30%),
                linear-gradient(180deg, #0F172A 0%, #111827 100%);
        }

        /* Shared Glassmorphism Panels */
        .glass-panel {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            padding: 12px;
        }

        /* TOP CLOCK SECTION */
        .top-section {
            text-align: center;
        }

        .title-label {
            font-size: 0.78rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #94A3B8;
            margin-bottom: 2px;
        }

        .clock {
            font-size: 4rem;
            font-weight: 300;
            letter-spacing: -1px;
            line-height: 1;
            color: #F8FAFC;
            text-shadow: 0 0 18px rgba(167, 139, 250, 0.20);
        }

        .date-display {
            margin-top: 4px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #94A3B8;
        }

        /* GIF SECTION */
        .gif-wrapper {
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 2px 0;
        }

        .gif-container {
            width: 100%;
            max-width: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gif-container img {
            width: 100%;
            height: auto;
            border-radius: 18px;
        }

        /* MESSAGE BOX */
        .message-box {
            width: 100%;
            text-align: center;
            font-size: 1.05rem;
            font-weight: 500;
            color: #C4B5FD;
            text-shadow: 0 0 12px rgba(196, 181, 253, 0.25);
            margin-bottom: 6px;
        }

        /* SPOTIFY CONTAINER */
        .spotify-container {
            width: 100%;
            overflow: hidden;
        }

        .spotify-container iframe {
            border: none;
            border-radius: 16px;
            display: block;
        }

        /* Subtle floating animation */
        .floating {
            animation: float 5s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>

<body>

    <!-- TOP CLOCK -->
    <div class="top-section glass-panel">
        <div class="title-label">Meg's Universe ✦</div>
        <div class="clock" id="clock">00:00</div>
        <div class="date-display" id="date-display">Loading...</div>
    </div>

    <!-- HEAD-BANGING SHEEP GIF -->
    <div class="gif-wrapper">
        <div class="gif-container floating">
            <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExYjFwMXViMWtreGt4aGMxZGRlaHMxN3JoeHppaDBlOXRzMmpoaDQ1NCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/TxqdI1WbB554I/giphy.gif" alt="Head-banging Sheep">
        </div>
    </div>

    <!-- MESSAGE -->
    <div class="message-box glass-panel" id="message">
        Loading your daily roast...
    </div>

    <!-- SPOTIFY PLAYER -->
    <div class="spotify-container glass-panel">
        <iframe
            data-testid="embed-iframe"
            src="https://open.spotify.com/embed/playlist/6guBKoODEMD4Hdmjimn2g2?utm_source=generator&theme=0"
            width="100%"
            height="152"
            allowfullscreen=""
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
        </iframe>
    </div>

    <script>
        // CLOCK SYSTEM
        function updateDashboard() {
            const now = new Date();
            const timeOptions = { timeZone: 'Australia/Sydney', hour: '2-digit', minute: '2-digit', hour12: false };
            const dateOptions = { timeZone: 'Australia/Sydney', weekday: 'long', month: 'long', day: 'numeric' };

            document.getElementById('clock').innerText = now.toLocaleTimeString('en-AU', timeOptions);
            document.getElementById('date-display').innerText = now.toLocaleDateString('en-AU', dateOptions);
        }

        // Messgage list
        const sweetNotes = [
            "Hello Kitty! 🥔",
            "You muppet! 🤡",
            "Kittyyyyyyyyyyyyyyyyyy",
            "Stop playing game and go to bed! 🤨",
            "You love me? 💖",
            "Meg Meg Meg Meg Meg 💖",
            "Cuddles? 💜",
            "If you see this I need kissed!"
        ];

        function updateMessage() {
            const message = sweetNotes[Math.floor(Math.random() * sweetNotes.length)];
            document.getElementById('message').innerText = message;
        }

        // Run both systems instantly when loaded or refreshed
        updateDashboard();
        updateMessage();

        // Keep them tracking smoothly over time
        setInterval(updateDashboard, 60000); // Ticks clock every minute
        setInterval(updateMessage, 900000);   // Changes msg every 15 minutes
    </script>

</body>
</html>

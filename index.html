<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meg's House ✦</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            /* From sydney_clock.html */
            background: linear-gradient(135deg, #191925, #0f0f16);
            text-align: center;
        }

        /* Panel — matches sydney_clock widget-box, no backdrop-filter (iCUE safe) */
        .glass-panel {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;
            padding: 10px 14px;
        }

        /* TOP CLOCK */
        .top-section {
            text-align: center;
        }

        .title-label {
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #a2a2c2;
            margin-bottom: 2px;
        }

        /* Clock — rose pink, thin, from sydney_clock */
        .clock {
            font-size: 3.6rem;
            font-weight: 200;
            letter-spacing: 3px;
            line-height: 1;
            color: #ffb6c1;
            /* Kept very subtle — full glow is GPU-heavy, this is safe */
            text-shadow: 0 0 12px rgba(255, 182, 193, 0.25);
        }

        /* Date — from sydney_clock */
        .date-display {
            margin-top: 6px;
            font-size: 0.72rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #a2a2c2;
        }

        /* Rose divider — from sydney_clock */
        .divider {
            width: 80px;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 182, 193, 0.6), transparent);
            margin: 6px auto 4px auto;
        }

        /* IMAGE SECTION */
        .gif-wrapper {
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px 0;
        }

        .photo-frame {
            max-width: 200px;
            width: 100%;
            border-radius: 16px;
            border: 1px solid rgba(255, 182, 193, 0.15);
            overflow: hidden;
            background: rgba(255, 182, 193, 0.03);
        }

        .photo-frame img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
            transition: opacity 0.5s ease;
        }

        .photo-frame img.fade-out {
            opacity: 0;
        }

        /* MESSAGE BOX — from sydney_clock message-box */
        .message-box {
            width: 100%;
            font-size: 1rem;
            font-style: italic;
            font-weight: 400;
            color: #e2e2ff;
            line-height: 1.6;
            padding: 10px 14px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.02);
        }

        /* MUSIC BAR */
        .music-bar {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 18px;
            border: 1px solid rgba(255, 182, 193, 0.12);
            background: rgba(255, 255, 255, 0.02);
        }

        .music-icon {
            font-size: 1.4rem;
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .music-text {
            font-size: 0.78rem;
            color: #a2a2c2;
            letter-spacing: 1px;
        }

        .music-text strong {
            display: block;
            font-size: 0.88rem;
            color: #ffb6c1;
            font-weight: 400;
            letter-spacing: 2px;
        }

        /* Animated bars */
        .bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 18px;
            margin-left: auto;
        }
        .bar {
            width: 3px;
            background: #ffb6c1;
            border-radius: 2px;
            animation: grow 0.8s ease-in-out infinite alternate;
            opacity: 0.7;
        }
        .bar:nth-child(1) { animation-delay: 0s;    height: 6px; }
        .bar:nth-child(2) { animation-delay: 0.15s; height: 12px; }
        .bar:nth-child(3) { animation-delay: 0.3s;  height: 18px; }
        .bar:nth-child(4) { animation-delay: 0.45s; height: 10px; }
        .bar:nth-child(5) { animation-delay: 0.6s;  height: 6px; }
        @keyframes grow {
            from { transform: scaleY(0.3); opacity: 0.4; }
            to   { transform: scaleY(1);   opacity: 0.9; }
        }
    </style>
</head>

<body>

    <!-- TOP CLOCK -->
    <div class="top-section glass-panel">
        <div class="title-label">Meg's House ✦</div>
        <div class="clock" id="clock">--:--</div>
        <div class="divider"></div>
        <div class="date-display" id="date-display">Loading...</div>
    </div>

    <!-- ROTATING PHOTOS -->
    <div class="gif-wrapper">
        <div class="photo-frame">
            <img src="img_1.jpg" alt="Photo" id="rotating-img" />
        </div>
    </div>

    <!-- MESSAGE -->
    <div class="message-box" id="message">
        Hello Kitty! 🥔
    </div>

    <!-- MUSIC BAR -->
    <div class="music-bar">
        <div class="music-icon">💿</div>
        <div class="music-text">
            <strong>Spotify Playlist</strong>
            open.spotify.com → Meg's Playlist
        </div>
        <div class="bars">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </div>

    <script>
        function updateClock() {
            try {
                var now = new Date();
                var timeOpts = { timeZone: 'Australia/Sydney', hour: '2-digit', minute: '2-digit', hour12: false };
                var dateOpts = { timeZone: 'Australia/Sydney', weekday: 'long', month: 'long', day: 'numeric' };
                document.getElementById('clock').textContent = now.toLocaleTimeString('en-AU', timeOpts);
                document.getElementById('date-display').textContent = now.toLocaleDateString('en-AU', dateOpts);
            } catch(e) { /* silent fail */ }
        }

        var sweetNotes = [
            "Hello Kitty! 🥔",
            "You muppet! 🤡",
            "Kittyyyyyyyyyyyyyyyyyy",
            "Stop playing games and go to bed! 🤨",
            "You love me? 💖",
            "Meg Meg Meg Meg Meg 💖",
            "Cuddles? 💜",
            "If you see this I need kisses!"
        ];

        var images = ['img_1.jpg', 'img_2.jpg', 'img_3.jpg', 'img_4.jpg'];
        var currentImg = 0;

        function updateMessage() {
            try {
                var msg = sweetNotes[Math.floor(Math.random() * sweetNotes.length)];
                document.getElementById('message').textContent = msg;
            } catch(e) { /* silent fail */ }
        }

        function rotateImage() {
            try {
                var el = document.getElementById('rotating-img');
                el.classList.add('fade-out');
                setTimeout(function() {
                    currentImg = (currentImg + 1) % images.length;
                    el.src = images[currentImg];
                    el.classList.remove('fade-out');
                }, 500);
            } catch(e) { /* silent fail */ }
        }

        updateClock();
        updateMessage();
        document.querySelector('.music-bar').style.cursor = 'pointer';
        document.querySelector('.music-bar').onclick = function() {
            window.open('https://open.spotify.com/playlist/6guBKoODEMD4Hdmjimn2g2', '_blank');
};
        setInterval(updateClock, 30000);
        setInterval(function() {
            updateMessage();
            rotateImage();
        }, 900000);
    </script>

</body>
</html>

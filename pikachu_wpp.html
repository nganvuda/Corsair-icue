<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meg's Universe ✦ ✦</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;

            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #F8FAFC;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;

            padding: 12px;

            background:
                radial-gradient(circle at top left, rgba(167, 139, 250, 0.15), transparent 35%),
                radial-gradient(circle at top right, rgba(125, 211, 252, 0.12), transparent 30%),
                linear-gradient(180deg, #0F172A 0%, #111827 100%);
        }

        /* Shared Glassmorphism Panels (Clock, Message, Spotify) */
        .glass-panel {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;

            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.35),
                0 0 20px rgba(167, 139, 250, 0.08);

            padding: 14px;
        }

        /* TOP CLOCK SECTION */
        .top-section {
            text-align: center;
        }

        .title-label {
            font-size: 0.78rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #94A3B8;
            margin-bottom: 4px;
        }

        .clock {
            font-size: 4.4rem;
            font-weight: 300;
            letter-spacing: -2px;
            line-height: 1;
            color: #F8FAFC;

            text-shadow:
                0 0 18px rgba(167, 139, 250, 0.20),
                0 0 32px rgba(125, 211, 252, 0.12);
        }

        .date-display {
            margin-top: 6px;
            font-size: 0.82rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #94A3B8;
        }

        /* GIF SECTION - Cleaned up to remove the panel box and border */
        .gif-wrapper {
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 5px 0;
        }

        .gif-container {
            width: 100%;
            max-width: 310px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0; /* Removed padding to let GIF stay clean */
        }

        .gif-container iframe {
            width: 100%;
            height: 180px;
            border: none;
            /* Keeps a clean soft round corner on the GIF frame edge */
            border-radius: 18px; 
            filter: drop-shadow(0 0 15px rgba(167, 139, 250, 0.15));
        }

        /* MESSAGE BOX */
        .message-box {
            width: 100%;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 500;
            color: #C4B5FD;
            text-shadow: 0 0 12px rgba(196, 181, 253, 0.25);
            margin-top: 4px;
            margin-bottom: 10px;
        }

        /* SPOTIFY */
        .spotify-container {
            width: 100%;
            overflow: hidden;
        }

        .spotify-container iframe {
            border: none;
            border-radius: 16px;
        }

        /* Smooth fade animation */
        .fade {
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Subtle floating effect */
        .floating {
            animation: float 5s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>

<body>

    <div class="top-section glass-panel fade">
        <div class="title-label">
            Meg's Universe ✦
        </div>

        <div class="clock" id="clock">
            00:00
        </div>

        <div class="date-display" id="date-display">
            Loading...
        </div>
    </div>

    <div class="gif-wrapper">
        <div class="gif-container floating">
            <iframe
                src="https://giphy.com/embed/dICjAqixKQFnG"
                frameBorder="0"
                class="giphy-embed"
                allowFullScreen>
            </iframe>
        </div>
    </div>

    <div class="message-box glass-panel fade" id="message">
        Loading...
    </div>

    <div class="spotify-container glass-panel fade">
        <iframe
            data-testid="embed-iframe"
            src="https://open.spotify.com/embed/playlist/6guBKoODEMD4Hdmjimn2g2?utm_source=generator&theme=0"
            width="100%"
            height="152"
            allowfullscreen=""
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
        </iframe>
    </div>

    <script>
        // CLOCK + DATE
        function updateDashboard() {
            const now = new Date();

            const timeOptions = {
                timeZone: 'Australia/Sydney',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            };

            const dateOptions = {
                timeZone: 'Australia/Sydney',
                weekday: 'long',
                month: 'long',
                day: 'numeric'
            };

            document.getElementById('clock').innerText =
                now.toLocaleTimeString('en-AU', timeOptions);

            document.getElementById('date-display').innerText =
                now.toLocaleDateString('en-AU', dateOptions);
        }

        // MY CUSTOM MESSAGES 💖
        const sweetNotes = [
            "Hello Kitty! 🥔",
            "You muffin! 🤡",
            "If you see this kiss me now 💋",
            "Stop playing, go to bed! 🤨",
            "You love me? 💖",
            "i like you when you",
            "Meg Meg Meg Meg Meg 💖",
            "Cuddles? 💜"
        ];

        // RANDOM MESSAGE ENGINE
        function updateMessage() {
            const message =
                sweetNotes[Math.floor(Math.random() * sweetNotes.length)];

            document.getElementById('message').innerText = message;
        }

        // Run instantly on load
        updateDashboard();
        updateMessage();

        // UPDATE CLOCK EVERY MINUTE
        setInterval(updateDashboard, 60000);

        // CHANGE MESSAGE EVERY 15 MINUTES (900,000 milliseconds)
        setInterval(updateMessage, 900000);
    </script>

</body>
</html>
